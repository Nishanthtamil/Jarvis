<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jarvis 2.0 — Personal Intelligence</title>
  
  <!-- Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #09090b;
      --surface: #18181b;
      --border: #27272a;
      --text: #fafafa;
      --muted: #a1a1aa;
      --accent: #6d28d9;
      --accent-hover: #7c3aed;
      --radius: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
      background: var(--bg); 
      color: var(--text); 
      font-family: 'Inter', sans-serif; 
      height: 100vh; 
      display: flex; 
      overflow: hidden;
    }

    /* Sidebar */
    .sidebar {
      width: 280px;
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      background: #0c0c0e;
    }
    .sidebar-header {
      padding: 1.5rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .sidebar-header h1 { font-size: 1rem; font-weight: 600; }
    .history-list {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
    }
    .history-item {
      padding: 0.75rem;
      border-radius: 8px;
      font-size: 0.85rem;
      cursor: pointer;
      margin-bottom: 0.5rem;
      border: 1px solid transparent;
      transition: all 0.2s;
      color: var(--muted);
    }
    .history-item:hover {
      background: var(--surface);
      color: var(--text);
    }
    .history-item.active {
      background: var(--surface);
      border-color: var(--border);
      color: var(--text);
    }

    /* Main Chat */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }
    .message {
      max-width: 850px;
      width: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .message.user { align-items: flex-end; }
    .message.assistant { align-items: flex-start; }

    .bubble {
      padding: 1rem 1.25rem;
      border-radius: var(--radius);
      line-height: 1.6;
      font-size: 0.95rem;
      word-break: break-word;
    }
    .user .bubble {
      background: var(--accent);
      color: white;
    }
    .assistant .bubble {
      background: transparent;
      padding: 0;
    }

    /* Thinking logs */
    .thought-container {
      width: 100%;
      border-left: 2px solid var(--border);
      padding-left: 1rem;
      margin-bottom: 1rem;
    }
    .thought-header {
      font-size: 0.75rem;
      color: var(--muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      user-select: none;
    }
    .thought-body {
      margin-top: 0.5rem;
      font-size: 0.8rem;
      color: var(--muted);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .thought-entry { display: flex; gap: 8px; }
    .thought-time { color: #3f3f46; min-width: 45px; }

    /* Markdown styling */
    .prose h1, .prose h2, .prose h3 { margin: 1.5rem 0 1rem 0; color: var(--text); }
    .prose p { margin-bottom: 1rem; }
    .prose pre {
      background: #111;
      padding: 1rem;
      border-radius: 8px;
      overflow-x: auto;
      margin: 1rem 0;
      border: 1px solid var(--border);
    }
    .prose code { font-family: 'Fira Code', monospace; font-size: 0.9em; }
    .prose ul, .prose ol { margin-left: 1.5rem; margin-bottom: 1rem; }

    /* Input Area */
    .input-wrapper {
      border-top: 1px solid var(--border);
      padding: 1.5rem 2rem;
      background: var(--bg);
    }
    .input-box {
      max-width: 850px;
      margin: 0 auto;
      position: relative;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 8px;
      display: flex;
      align-items: flex-end;
      gap: 8px;
    }
    textarea {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text);
      resize: none;
      padding: 10px;
      font-family: inherit;
      font-size: 0.95rem;
      max-height: 200px;
      outline: none;
    }
    .action-btn {
      background: transparent;
      border: none;
      color: var(--muted);
      padding: 8px;
      cursor: pointer;
      border-radius: 8px;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .action-btn:hover { background: #27272a; color: var(--text); }
    .action-btn.primary { background: var(--accent); color: white; }
    .action-btn.primary:hover { background: var(--accent-hover); }
    .action-btn.recording { color: #ef4444; animation: pulse 1.5s infinite; }

    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

    /* Toasts */
    .toast-container {
      position: fixed;
      top: 1.5rem;
      right: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      z-index: 1000;
    }
    .toast {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 1rem;
      border-radius: 10px;
      box-shadow: 0 10px 15px -3px rgba(0,0,0,0.5);
      min-width: 300px;
      display: flex;
      gap: 12px;
      animation: slideIn 0.3s ease-out;
    }
    @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    .toast-icon { color: var(--accent-light); }
    .toast-content h4 { font-size: 0.85rem; margin-bottom: 2px; }
    .toast-content p { font-size: 0.75rem; color: var(--muted); }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: #3f3f46; }
  </style>
</head>
<body>

  <!-- Sidebar: History -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg>
      <h1>Jarvis 2.0</h1>
    </div>
    <div class="history-list" id="history-list">
      <!-- History items injected here -->
    </div>
  </aside>

  <!-- Main Chat Area -->
  <main class="main">
    <div class="chat-container" id="chat-container">
      <!-- Messages injected here -->
      <div class="message assistant">
        <div class="bubble prose">
          Welcome back. How can I help you today?
        </div>
      </div>
    </div>

    <!-- Input Area -->
    <div class="input-wrapper">
      <div class="input-box">
        <button class="action-btn" id="mic-btn" title="Voice Input">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/></svg>
        </button>
        <textarea id="chat-input" placeholder="Type a message or use voice..." rows="1"></textarea>
        <button class="action-btn primary" id="send-btn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </div>
    </div>
  </main>

  <!-- Toasts for Proactive Alerts -->
  <div class="toast-container" id="toast-container"></div>

  <script>
    // --- State & Config ---
    let currentSessionId = null;
    let isRecording = false;
    let mediaRecorder = null;
    let audioChunks = [];

    // Configure marked for code highlighting
    marked.setOptions({
      highlight: function(code, lang) {
        return hljs.highlightAuto(code).value;
      },
      breaks: true
    });

    // --- Core UI Logic ---

    const chatContainer = document.getElementById('chat-container');
    const chatInput = document.getElementById('chat-input');
    const sendBtn = document.getElementById('send-btn');
    const micBtn = document.getElementById('mic-btn');
    const historyList = document.getElementById('history-list');

    // Auto-resize textarea
    chatInput.addEventListener('input', () => {
      chatInput.style.height = 'auto';
      chatInput.style.height = chatInput.scrollHeight + 'px';
    });

    // Handle Enter to send
    chatInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    sendBtn.addEventListener('click', sendMessage);

    async function sendMessage(text = null) {
      const content = text || chatInput.value.trim();
      if (!content) return;

      if (!text) {
        chatInput.value = '';
        chatInput.style.height = 'auto';
      }

      // Add user message to UI
      addMessage('user', content);

      // Create assistant message placeholder
      const msgDiv = addMessage('assistant', '');
      const thoughtContainer = createThoughtContainer(msgDiv);
      const bubble = msgDiv.querySelector('.bubble');
      
      let answerText = "";

      try {
        const resp = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: content, session_id: currentSessionId }),
        });

        const reader = resp.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split("\n");
          buffer = lines.pop();

          for (const line of lines) {
            if (!line.startsWith("data: ")) continue;
            let event;
            try { event = JSON.parse(line.slice(6)); } catch { continue; }

            if (event.type === "status" || event.type === "search" || event.type === "fetch" || event.type === "summary" || event.type === "gap") {
              addThought(thoughtContainer, event);
            } else if (event.type === "answer_chunk") {
              answerText += event.text;
              bubble.innerHTML = marked.parse(answerText);
              bubble.querySelectorAll('pre code').forEach(el => hljs.highlightElement(el));
              chatContainer.scrollTop = chatContainer.scrollHeight;
            } else if (event.type === "done") {
              if (event.session_id) currentSessionId = event.session_id;
              loadHistory(); // Refresh sidebar
            } else if (event.type === "error") {
              addThought(thoughtContainer, { type: 'error', message: event.message });
            }
          }
        }
      } catch (err) {
        addThought(thoughtContainer, { type: 'error', message: `Connection error: ${err.message}` });
      }
    }

    function addMessage(role, content) {
      const msgDiv = document.createElement('div');
      msgDiv.className = `message ${role}`;
      msgDiv.innerHTML = `<div class="bubble prose">${marked.parse(content)}</div>`;
      chatContainer.appendChild(msgDiv);
      chatContainer.scrollTop = chatContainer.scrollHeight;
      return msgDiv;
    }

    function createThoughtContainer(parent) {
      const container = document.createElement('div');
      container.className = 'thought-container';
      container.innerHTML = `
        <div class="thought-header" onclick="this.nextElementSibling.style.display = this.nextElementSibling.style.display === 'none' ? 'flex' : 'none'">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="6 9 12 15 18 9"/></svg>
          Thinking Process
        </div>
        <div class="thought-body"></div>
      `;
      parent.insertBefore(container, parent.firstChild);
      return container.querySelector('.thought-body');
    }

    function addThought(container, event) {
      const entry = document.createElement('div');
      entry.className = 'thought-entry';
      let msg = event.message || "";
      if (event.type === 'search') msg = `Searching: "${event.query}"`;
      if (event.type === 'fetch') msg = `Fetched: ${event.url.split('//')[1].split('/')[0]}`;
      if (event.type === 'summary') msg = `Extracted info from source`;
      if (event.type === 'gap') msg = `Identified gaps: ${event.gaps.join(', ')}`;
      if (event.type === 'error') msg = `Error: ${event.message}`;

      entry.innerHTML = `
        <span class="thought-time">${new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' })}</span>
        <span>${msg}</span>
      `;
      container.appendChild(entry);
      container.parentElement.parentElement.scrollTop = container.parentElement.parentElement.scrollHeight;
    }

    // --- Voice Logic ---

    micBtn.addEventListener('click', toggleRecording);

    async function toggleRecording() {
      if (isRecording) {
        mediaRecorder.stop();
        micBtn.classList.remove('recording');
        isRecording = false;
      } else {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);
        audioChunks = [];

        mediaRecorder.ondataavailable = (e) => audioChunks.push(e.data);
        mediaRecorder.onstop = async () => {
          const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
          const resp = await fetch('/voice/transcribe', {
            method: 'POST',
            body: audioBlob
          });
          const data = await resp.json();
          if (data.text) {
            chatInput.value = data.text;
            chatInput.focus();
            // Automatically send? 
            // sendMessage(data.text);
          }
        };

        mediaRecorder.start();
        micBtn.classList.add('recording');
        isRecording = true;
      }
    }

    // --- History & Alerts ---

    async function loadHistory() {
      const resp = await fetch("/history");
      const data = await resp.json();
      historyList.innerHTML = data.sessions.map(s => `
        <div class="history-item ${currentSessionId === s.id ? 'active' : ''}" onclick="selectSession('${s.id}', '${s.goal}')">
          ${s.goal.slice(0, 60)}${s.goal.length > 60 ? '...' : ''}
        </div>
      `).join("");
    }

    function selectSession(id, goal) {
      currentSessionId = id;
      // Ideally load session messages here. For now just clear and set context.
      chatContainer.innerHTML = `<div class="message assistant"><div class="bubble prose">Context switched to: <strong>${goal}</strong>. How can I continue?</div></div>`;
      loadHistory();
    }

    // WebSocket for Proactive Alerts
    const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
    const ws = new WebSocket(`${wsProtocol}//${window.location.host}/ws`);

    ws.onmessage = (event) => {
      const data = JSON.parse(event.data);
      if (data.type === 'alert') {
        showToast(data.content);
      }
    };

    function showToast(content) {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = 'toast';
      toast.innerHTML = `
        <div class="toast-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        </div>
        <div class="toast-content">
          <h4>Proactive Alert</h4>
          <p>${content}</p>
        </div>
      `;
      container.appendChild(toast);
      setTimeout(() => toast.remove(), 8000);
    }

    loadHistory();
  </script>
</body>
</html>
